pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Solo para ColorSheet, que no está publicado en Maven Central
        maven {
            url = 'https://jitpack.io'
            content { includeGroup 'com.github.msasikanth' }
        }
    }
}

rootProject.name = "MyTraya2"
include ':app'
