plugins {
    id 'com.android.application'
}

// Firma de release opcional: se lee de keystore.properties (local, fuera de git)
// o de variables de entorno (CI). Sin ella, el APK de release sale sin firmar.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'SIGNING_STORE_FILE')

android {
    namespace = 'com.bastianorellana.tresenraya'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.bastianorellana.tresenraya"
        minSdk = 24
        targetSdk = 36
        versionCode = 2
        versionName = "2.0.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = signingValue('storePassword', 'SIGNING_STORE_PASSWORD')
                keyAlias = signingValue('keyAlias', 'SIGNING_KEY_ALIAS')
                keyPassword = signingValue('keyPassword', 'SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStoreFile) {
                signingConfig = signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.4'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'nl.dionsegijn:konfetti:1.3.2'
    implementation 'com.github.msasikanth:ColorSheet:1.0.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
